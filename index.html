<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>摸鱼鱼鱼</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  /* 主题变量：深（默认）/ 灰 / 浅，由 body class 切换 */
  :root {
    --bg: #17181c; --bar: #101114; --panel: #1f2127;
    --fg: #c9cdd4; --bright: #eef1f5; --muted: #646a74; --mid: #8a9099;
    --border: #282b31; --hover-bg: rgba(255,255,255,.06); --tab-bg: rgba(255,255,255,.09);
    --acc: #3ee08f; --acc-dim: rgba(62,224,143,.14); --acc-text: #08130d;
    --shadow: 0 12px 32px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.35);
  }
  body.t-gray {
    --bg: #2e3138; --bar: #25272d; --panel: #3a3d45;
    --fg: #ccd0d6; --bright: #f0f3f7; --muted: #8b8f99; --mid: #a6abb4;
    --border: #454955; --hover-bg: rgba(255,255,255,.08); --tab-bg: rgba(255,255,255,.12);
    --acc: #3ee08f; --acc-dim: rgba(62,224,143,.16); --acc-text: #08130d;
    --shadow: 0 12px 32px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.28);
  }
  body.t-light {
    --bg: #f5f6f8; --bar: #eaecf1; --panel: #ffffff;
    --fg: #2c2f36; --bright: #101215; --muted: #9ba1ab; --mid: #6b7078;
    --border: #dcdfe6; --hover-bg: rgba(16,24,40,.06); --tab-bg: rgba(16,24,40,.09);
    --acc: #0da672; --acc-dim: rgba(13,166,114,.13); --acc-text: #ffffff;
    --shadow: 0 12px 32px rgba(20,30,50,.16), 0 2px 8px rgba(20,30,50,.10);
  }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; }
  svg { display: block; }
  #bar svg, #addr svg, #rhead svg { width: 13px; height: 13px; }

  /* 顶栏 */
  #bar {
    height: 28px; display: flex; align-items: center; gap: 2px;
    background: var(--bar); padding: 0 4px; flex: none;
    -webkit-app-region: drag; user-select: none;
    border-bottom: 1px solid var(--border);
  }
  #grip {
    -webkit-app-region: drag; flex: none; width: 16px; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); cursor: move; user-select: none;
  }
  #grip:hover { color: var(--bright); }
  #tabs { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; overflow: hidden; -webkit-app-region: no-drag; }
  .tab {
    display: flex; align-items: center; gap: 3px; height: 21px; min-width: 0; flex: 0 1 auto;
    padding: 0 3px 0 9px; border-radius: 7px; font-size: 11px;
    color: var(--muted); cursor: pointer; transition: background .1s ease, color .1s ease;
  }
  .tab:hover { color: var(--fg); background: var(--hover-bg); }
  .tab.active { color: var(--bright); background: var(--acc-dim); }
  .tab .t { max-width: 88px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .x { width: 14px; height: 14px; border-radius: 4px; flex: none; display: flex;
            align-items: center; justify-content: center; font-size: 10px; opacity: 0; }
  .tab:hover .x, .tab.active .x { opacity: .6; }
  .tab .x:hover { opacity: 1; background: var(--tab-bg); }

  #bar button {
    -webkit-app-region: no-drag; flex: none; border: none; background: transparent;
    color: var(--muted); cursor: pointer; border-radius: 6px; width: 21px; height: 21px;
    display: flex; align-items: center; justify-content: center;
    transition: background .1s ease, color .1s ease;
  }
  #bar button:hover { color: var(--bright); background: var(--hover-bg); }
  #bar button.on { color: var(--acc); }
  #btn-star.on svg { fill: currentColor; }
  #newtab:disabled { opacity: .25; cursor: default; }

  /* 地址栏：悬停出现，离开 2s 且无焦点收起 */
  #addr {
    height: 0; opacity: 0; overflow: hidden; flex: none;
    display: flex; align-items: center; gap: 3px; padding: 0 5px;
    background: var(--bar); transition: height .12s ease, opacity .12s ease, padding .12s ease;
    border-bottom: 1px solid transparent;
  }
  #topwrap.hover #addr { height: 30px; opacity: 1; padding: 3px 5px; border-bottom-color: var(--border); }
  #addr button {
    height: 22px; min-width: 22px; padding: 0 4px; border: none; border-radius: 6px;
    background: transparent; color: var(--mid); cursor: pointer; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  #addr button:hover { background: var(--hover-bg); color: var(--bright); }
  #addr input {
    flex: 1; height: 22px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--bg); color: var(--bright); font-size: 11px; padding: 0 8px;
    outline: none; -webkit-app-region: no-drag;
  }
  #addr input:focus { border-color: var(--acc); }
  #go { color: var(--acc) !important; }

  #view { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
  webview { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: var(--bg); }
  webview.off { display: none; }

  /* 底部横向滚动条（页面超宽时才出现） */
  #hscroll {
    height: 9px; flex: none; background: var(--bar); display: none;
    position: relative; cursor: pointer;
  }
  #hscroll.show { display: block; }
  #hthumb {
    position: absolute; top: 1px; height: 7px; border-radius: 4px;
    background: var(--mid); opacity: .55; cursor: grab; min-width: 24px;
  }
  #hthumb:hover { opacity: .8; }
  #hthumb:active { cursor: grabbing; opacity: 1; }

  /* 弹出面板：出现在顶栏下方，不遮住按钮 */
  .pop {
    position: fixed; right: 6px; top: 32px; width: 252px; display: none; z-index: 20;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 10px 12px; font-size: 11px; line-height: 1.6; color: var(--mid);
    /* 窗口很矮时面板自己滚，不再被窗口裁掉 */
    max-height: calc(100vh - 40px); overflow-y: auto; overscroll-behavior: contain;
  }
  .pop::-webkit-scrollbar { width: 6px; }
  .pop::-webkit-scrollbar-thumb { background: rgba(128,128,128,.35); border-radius: 3px; }
  .pop::-webkit-scrollbar-thumb:hover { background: rgba(128,128,128,.6); }
  .pop::-webkit-scrollbar-track { background: transparent; }
  .pop.show { display: block; }
  .pop .close {
    position: absolute; top: 4px; right: 5px; width: 17px; height: 17px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); cursor: pointer; font-size: 12px; line-height: 1;
  }
  .pop .close:hover { color: var(--bright); background: var(--hover-bg); }
  .pop b { color: var(--bright); font-weight: 600; }
  .pop ol { margin: 5px 0 7px 16px; }
  .pop li { margin-bottom: 2px; }
  #bm {
    width: 100%; height: 48px; resize: none; background: var(--bar); color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px; font-size: 9.5px;
    font-family: Consolas, monospace; padding: 4px; margin-bottom: 6px;
  }
  #copy { width: 100%; height: 23px; border: none; border-radius: 6px;
          background: var(--acc); color: var(--acc-text); font-size: 11px; font-weight: 500; cursor: pointer; }
  #copy:hover { filter: brightness(1.08); }
  #alpha-row, #zoom-row { display: flex; align-items: center; gap: 7px; }
  #alpha, #zoom { flex: 1; accent-color: var(--acc); height: 14px; }
  #alpha-val, #zoom-val { min-width: 32px; text-align: right; color: var(--bright); font-size: 10.5px; }
  #fit-row {
    display: flex; align-items: center; gap: 5px; margin-top: 7px;
    font-size: 10.5px; color: var(--mid); cursor: pointer; user-select: none;
  }
  #fit { accent-color: var(--acc); }
  .hint { color: var(--muted); font-size: 10px; margin-top: 4px; line-height: 1.4; }

  /* 更多菜单 */
  .pop.menu { width: 196px; padding: 5px; }
  .mi {
    display: flex; align-items: center; gap: 7px; height: 27px; padding: 0 9px; margin: 0;
    font-size: 11px; color: var(--fg); cursor: pointer; user-select: none; border-radius: 6px;
  }
  .mi:hover { background: var(--hover-bg); color: var(--bright); }
  .mi svg { width: 13px; height: 13px; flex: none; color: var(--mid); }
  .mi:hover svg { color: var(--acc); }
  .mi .lb { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mi .ck { margin-left: auto; font-size: 10px; color: var(--acc); }
  .mi .ck.dim { color: var(--muted); }
  .sep { height: 1px; background: var(--border); margin: 4px 6px; }

  /* 列表面板：收藏 / 历史 */
  .listpop { width: 252px; }
  .listpop .ph { display: flex; align-items: center; justify-content: space-between; }
  #hist-clear, #fav-count { color: var(--muted); font-size: 9.5px; }
  #hist-clear { cursor: pointer; padding: 1px 5px; border-radius: 4px; }
  #hist-clear:hover { color: var(--bright); background: var(--hover-bg); }
  .list { max-height: 264px; overflow-y: auto; overscroll-behavior: contain; margin-top: 6px; }
  .li { display: flex; align-items: center; gap: 5px; padding: 4px 5px; border-radius: 6px; cursor: pointer; }
  .li:hover { background: var(--hover-bg); }
  .li .nm { flex: 1; min-width: 0; }
  .li .t1 { font-size: 10.5px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li:hover .t1 { color: var(--bright); }
  .li .u { font-size: 9.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li .tm { flex: none; font-size: 9.5px; color: var(--muted); }
  .li .del {
    flex: none; width: 16px; height: 16px; border-radius: 4px; font-size: 11px;
    display: flex; align-items: center; justify-content: center; color: var(--muted);
    opacity: 0; visibility: hidden;
  }
  .li:hover .del { opacity: .7; visibility: visible; }
  .li .del:hover { opacity: 1; color: var(--bright); background: var(--tab-bg); }
  .empty { color: var(--muted); font-size: 10px; text-align: center; padding: 14px 0; }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb { background: rgba(128,128,128,.45); border-radius: 3px; }

  /* 文档阅读模式 */
  #reader {
    position: absolute; inset: 0; z-index: 10; display: none;
    background: var(--bg); color: var(--fg); flex-direction: column;
  }
  #reader.show { display: flex; }
  #rhead {
    flex: none; height: 30px; display: flex; align-items: center; gap: 2px;
    background: var(--bar); padding: 0 5px; user-select: none;
    border-bottom: 1px solid var(--border);
  }
  #rhead .rt { flex: 1; min-width: 0; font-size: 11px; color: var(--bright);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
  #rhead button {
    flex: none; border: none; background: transparent; color: var(--muted);
    height: 22px; min-width: 22px; padding: 0 4px; border-radius: 6px;
    font-size: 10.5px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #rhead button:hover { color: var(--bright); background: var(--hover-bg); }
  #rbody { flex: 1; overflow-y: auto; padding: 16px 20px 48px; }
  #rbody .inner {
    max-width: 700px; margin: 0 auto; line-height: 1.85; word-break: break-word;
    font-family: Georgia, "Microsoft YaHei", "PingFang SC", serif;
  }
  #rbody .inner.plain {
    font-family: Consolas, "Microsoft YaHei", monospace; white-space: pre-wrap; line-height: 1.6;
  }
  #rbody h1, #rbody h2, #rbody h3, #rbody h4 { color: var(--bright); line-height: 1.4; margin: 1.2em 0 .5em; }
  #rbody h1 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: .25em; }
  #rbody h2 { font-size: 1.3em; }
  #rbody h3 { font-size: 1.12em; }
  #rbody p { margin: .6em 0; }
  #rbody ul, #rbody ol { margin: .6em 0 .6em 1.6em; }
  #rbody li { margin: .25em 0; }
  #rbody blockquote { border-left: 3px solid var(--acc); padding: 2px 12px; margin: .8em 0; color: var(--mid); background: var(--acc-dim); border-radius: 0 6px 6px 0; }
  #rbody pre { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; overflow-x: auto; font-family: Consolas, monospace; font-size: .85em; }
  #rbody code { font-family: Consolas, monospace; font-size: .9em; background: var(--panel); border-radius: 3px; padding: 1px 4px; }
  #rbody pre code { background: transparent; padding: 0; }
  #rbody a { color: var(--acc); text-decoration: none; }
  #rbody a:hover { text-decoration: underline; }
  #rbody hr { border: none; border-top: 1px solid var(--border); margin: 1.2em 0; }
  #rbody table { border-collapse: collapse; margin: .8em 0; }
  #rbody td, #rbody th { border: 1px solid var(--border); padding: 4px 8px; font-size: .92em; }
  #rbody img { max-width: 100%; }

  /* 漫画 / 图片阅读：单页翻页 */
  #reader.comic #rbody { padding: 0; display: flex; align-items: flex-start; justify-content: center; overflow: auto; }
  #rcontent.comic { max-width: none; margin: 0; line-height: 0; text-align: center; }
  #rcontent.comic img { width: var(--cw, 100%); height: auto; display: inline-block; cursor: pointer; }
  #reader:not(.comic) #rprev, #reader:not(.comic) #rnext { display: none; }
  #rbody::-webkit-scrollbar { width: 8px; }
  #rbody::-webkit-scrollbar-thumb { background: rgba(128,128,128,.45); border-radius: 4px; }

  /* 拖入文件的提示层 */
  #dropzone {
    position: fixed; inset: 0; z-index: 40; display: none;
    background: var(--acc-dim); border: 2px dashed var(--acc);
    align-items: center; justify-content: center;
    color: var(--acc); font-size: 13px; user-select: none;
    backdrop-filter: blur(2px);
  }
  #dropzone.on { display: flex; }

  /* 背景主题 */
  #bg-row { display: flex; align-items: center; gap: 6px; margin-top: 9px; }
  #bg-row .lbl { flex: none; }
  .bgbtn {
    flex: 1; height: 21px; border: 1px solid var(--border); border-radius: 6px;
    background: transparent; color: var(--mid); font-size: 10.5px; cursor: pointer;
  }
  .bgbtn:hover { color: var(--bright); }
  .bgbtn.on { border-color: var(--acc); color: var(--acc); background: var(--acc-dim); }
</style>
</head>
<body>
  <div id="topwrap">
    <div id="bar">
      <div id="grip" title="按住拖动，移动小窗"><svg viewBox="0 0 12 12"><g fill="currentColor"><circle cx="3.5" cy="2.5" r="1.1"/><circle cx="8.5" cy="2.5" r="1.1"/><circle cx="3.5" cy="6" r="1.1"/><circle cx="8.5" cy="6" r="1.1"/><circle cx="3.5" cy="9.5" r="1.1"/><circle cx="8.5" cy="9.5" r="1.1"/></g></svg></div>
      <div id="tabs"></div>
      <button id="newtab" title="新建标签页"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 3.2v9.6M3.2 8h9.6"/></svg></button>
      <button id="btn-star" title="收藏当前页"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.9l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg></button>
      <button id="btn-fav" title="收藏夹"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4.2 2.4h7.6v11.2L8 10.9l-3.8 2.7z"/></svg></button>
      <button id="btn-hist" title="历史记录"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 8a5.4 5.4 0 1 0 1.7-3.9"/><path d="M2.3 2.6l.2 2.7 2.7-.2"/><path d="M8 5.4V8l1.9 1.2"/></svg></button>
      <button id="btn-more" title="更多"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg></button>
      <button id="btn-hide" title="隐藏（Alt+Q）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 8h9"/></svg></button>
    </div>

    <div id="addr">
      <button id="back" title="后退"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
      <button id="fwd" title="前进"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg></button>
      <button id="reload" title="刷新"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 8A5.2 5.2 0 1 1 11 3.9"/><path d="M11.2 1.6l.2 2.7-2.7.2"/></svg></button>
      <input id="url" type="text" placeholder="网址" spellcheck="false">
      <button id="opendoc" title="打开本地文档 / 漫画"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 1.8h5.2L12.5 5v9.2H4z"/><path d="M9.2 1.8V5h3.3"/></svg></button>
      <button id="go" title="打开"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h9.5M9.2 4.7L12.5 8l-3.3 3.3"/></svg></button>
      <button id="ext" title="在系统浏览器里打开当前页"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.2H3.2v9.6h9.6V9.5"/><path d="M9.8 2.6h3.6v3.6M13.1 2.9L7.8 8.2"/></svg></button>
    </div>
  </div>

  <div id="view"></div>
  <div id="reader">
    <div id="rhead">
      <span class="rt" id="rtitle"></span>
      <button id="rprev" title="上一页（←）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5L6 8l3.5 4.5"/></svg></button>
      <button id="rnext" title="下一页（→）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5L10 8l-3.5 4.5"/></svg></button>
      <button id="rfnt-m" title="缩小字体">A-</button>
      <button id="rfnt-p" title="放大字体">A+</button>
      <button id="rexternal" title="用系统默认程序打开原文件"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.2H3.2v9.6h9.6V9.5"/><path d="M9.8 2.6h3.6v3.6M13.1 2.9L7.8 8.2"/></svg></button>
      <button id="rclose" title="关闭（Esc）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"/></svg></button>
    </div>
    <div id="rbody"><div class="inner" id="rcontent"></div></div>
  </div>
  <div id="dropzone">松手打开文档 / 图片 / 漫画</div>
  <div id="hscroll"><div id="hthumb"></div></div>

  <div class="pop" id="link-panel">
    <span class="close">×</span>
    <b>把浏览器当前页发过来</b>
    <ol>
      <li>把下面这段存成浏览器书签</li>
      <li>在任何页面点一下这个书签</li>
    </ol>
    <textarea id="bm" readonly></textarea>
    <button id="copy">复制书签代码</button>
  </div>

  <div class="pop" id="alpha-panel" style="width:190px">
    <span class="close">×</span>
    <b>外观</b>
    <div id="alpha-row">
      <input id="alpha" type="range" min="30" max="100" value="100">
      <span id="alpha-val">100%</span>
    </div>
    <div id="bg-row">
      <span class="lbl">背景</span>
      <button class="bgbtn" data-t="dark">深</button>
      <button class="bgbtn" data-t="gray">灰</button>
      <button class="bgbtn" data-t="light">浅</button>
    </div>
  </div>

  <div class="pop" id="zoom-panel" style="width:210px">
    <span class="close">×</span>
    <b>页面缩放</b>
    <div id="zoom-row">
      <input id="zoom" type="range" min="30" max="200" step="5" value="100">
      <span id="zoom-val">100%</span>
    </div>
    <label id="fit-row"><input id="fit" type="checkbox" checked> 适应宽度（整页缩放到窗口内）</label>
    <div class="hint">网页里 Ctrl + 滚轮 也能缩放</div>
  </div>

  <div class="pop menu" id="more-panel">
    <div class="mi" id="mi-doc"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 1.8h5.2L12.5 5v9.2H4z"/><path d="M9.2 1.8V5h3.3"/></svg><span class="lb">打开文档…</span><span class="ck dim">›</span></div>
    <div class="mi" id="mi-docdir"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M1.8 4.2h4.3l1.3 1.7h6.8v7.1H1.8z"/><path d="M1.8 4.2V3h3.5"/></svg><span class="lb">打开文件夹</span><span class="ck dim">›</span></div>
    <div class="sep"></div>
    <div class="mi" id="mi-adaptive"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="1.8" y="2.6" width="12.4" height="10.8" rx="1.6"/><path d="M1.8 6.2h12.4M6.4 6.2v7.2"/></svg><span class="lb">自适应排版</span><span class="ck">✓</span></div>
    <div class="mi" id="mi-zoom"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.4"/><path d="M10.3 10.3L13.6 13.6M5 7h4M7 5v4"/></svg><span class="lb">页面缩放</span><span class="ck dim">100%</span></div>
    <div class="mi" id="mi-alpha"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.2a5.8 5.8 0 1 0 0 11.6c1.3 0 1.6-2.2.4-2.6-1-.3-.9-1.6.2-1.9l1.5-.5A2.1 2.1 0 0 0 11.6 6"/><circle cx="5.6" cy="6" r=".9" fill="currentColor" stroke="none"/><circle cx="8" cy="4.9" r=".9" fill="currentColor" stroke="none"/></svg><span class="lb">外观</span><span class="ck dim">›</span></div>
    <div class="mi" id="mi-link"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6.6 9.4a2.6 2.6 0 0 0 3.9.3l1.8-1.8a2.6 2.6 0 0 0-3.7-3.7l-1 1"/><path d="M9.4 6.6a2.6 2.6 0 0 0-3.9-.3L3.7 8.1a2.6 2.6 0 0 0 3.7 3.7l1-1"/></svg><span class="lb">浏览器联动</span><span class="ck dim">›</span></div>
    <div class="sep"></div>
    <div class="mi" id="mi-top"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.4l6 3.2H2zM8 5.6v8M8 9.4l3 4.2H5z"/></svg><span class="lb">置顶</span><span class="ck">✓</span></div>
    <div class="mi" id="mi-hover"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.6 8S3.9 3.8 8 3.8 14.4 8 14.4 8 12.1 12.2 8 12.2 1.6 8 1.6 8z"/><circle cx="8" cy="8" r="2"/></svg><span class="lb">悬停显隐</span><span class="ck"></span></div>
  </div>

  <div class="pop listpop" id="fav-panel">
    <span class="close">×</span>
    <div class="ph"><b>收藏夹</b><span id="fav-count"></span></div>
    <div class="list" id="fav-list"></div>
  </div>

  <div class="pop listpop" id="hist-panel">
    <span class="close">×</span>
    <div class="ph"><b>历史记录</b><span id="hist-clear">清空</span></div>
    <div class="list" id="hist-list"></div>
  </div>

<script src="lib/mammoth.browser.min.js"></script>
<script>
    const topwrap = document.getElementById("topwrap");
    const tabsEl = document.getElementById("tabs");
    const newtabBtn = document.getElementById("newtab");
    const urlInput = document.getElementById("url");
    const viewEl = document.getElementById("view");
    const hscroll = document.getElementById("hscroll");
    const hthumb = document.getElementById("hthumb");
    const favPanel = document.getElementById("fav-panel");
    const histPanel = document.getElementById("hist-panel");
    const morePanel = document.getElementById("more-panel");
    const favList = document.getElementById("fav-list");
    const histList = document.getElementById("hist-list");
    const btnStar = document.getElementById("btn-star");
    const linkPanel = document.getElementById("link-panel");
    const alphaPanel = document.getElementById("alpha-panel");
    const zoomPanel = document.getElementById("zoom-panel");
    const alphaInput = document.getElementById("alpha");
    const alphaVal = document.getElementById("alpha-val");
    const zoomInput = document.getElementById("zoom");
    const zoomVal = document.getElementById("zoom-val");
    const fitBox = document.getElementById("fit");

    const MOBILE_UA = "Mozilla/5.0 (iPhone; CPU iPhone OS 17_2 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.2 Mobile/15E148 Safari/604.1";
    const DESKTOP_UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
    const DEFAULT_URL = "https://www.bing.com";
    const MAX_TABS = 5;
    const WV_PRELOAD = new URL("webview-preload.js", location.href).href;
    const PORT = window.moyu.getPort();
    const TOKEN = window.moyu.getToken();
    const BOOKMARKLET = "javascript:(()=>{fetch('http://127.0.0.1:" + PORT + "/open?k=" + TOKEN + "',{method:'POST',mode:'no-cors',body:JSON.stringify({url:location.href})})})()";
    document.getElementById("bm").value = BOOKMARKLET;

    let adaptiveOn = true;
    let topOn = true;
    let hoverOn = false;
    let tabs = [];
    let activeId = null;
    let tabSeq = 0;

    /* 缩放设置：userZoom 是用户想要的倍率，appliedZoom 是实际生效的（适宽时会小于 userZoom） */
    let fitWidth = localStorage.getItem("moyu-fit") !== "0";
    const savedZoom = parseFloat(localStorage.getItem("moyu-zoom"));
    const USER_ZOOM = (isFinite(savedZoom) && savedZoom >= 0.3 && savedZoom <= 2) ? savedZoom : 1;

    function clampZoom(z) { return Math.min(2, Math.max(0.3, Math.round(z * 1000) / 1000)); }

    function applyZoom(t, z, remember) {
      t.appliedZoom = clampZoom(z);
      try { t.webview.setZoomFactor(t.appliedZoom); } catch (e) {}
      if (remember) { t.zoom = t.appliedZoom; localStorage.setItem("moyu-zoom", String(t.appliedZoom)); }
      syncZoomUI();
    }

    /* 适宽：把整页缩放到窗口宽度内（只缩小，不放大，避免来回抖动） */
    function fitTab(t) {
      if (!t || t.id !== activeId) return;
      const m = t.metrics;
      if (!m || !m.vw || m.vw < 40) return;
      const W = viewEl.clientWidth || 1;
      const ovScroll = m.maxX > 8 ? m.vw + m.maxX : 0;
      const ovDoc = (m.dw && m.dw > m.vw + 8) ? m.dw : 0;
      const contentW = Math.max(m.vw, ovScroll, ovDoc);
      const want = clampZoom(Math.min(t.zoom, W / contentW));
      if (Math.abs(want - t.appliedZoom) > 0.006) {
        t.appliedZoom = want;
        try { t.webview.setZoomFactor(want); } catch (e) {}
        syncZoomUI();
      }
    }

    function syncZoomUI() {
      const t = activeTab();
      const z = t ? t.appliedZoom : USER_ZOOM;
      const pct = Math.round(z * 100);
      zoomVal.textContent = pct + "%";
      if (document.activeElement !== zoomInput) zoomInput.value = Math.max(30, Math.min(200, pct));
      fitBox.checked = fitWidth;
      const miZ = document.getElementById("mi-zoom");
      if (miZ) {
        const ck = miZ.querySelector(".ck");
        ck.textContent = pct + "%";
        ck.classList.toggle("dim", !(fitWidth || Math.abs(z - 1) > 0.02));
      }
    }

    function activeTab() { return tabs.find((t) => t.id === activeId) || null; }

    /* ---------- 标签页 ---------- */
    function renderTabs() {
      tabsEl.innerHTML = "";
      for (const t of tabs) {
        const el = document.createElement("div");
        el.className = "tab" + (t.id === activeId ? " active" : "");
        const title = document.createElement("span");
        title.className = "t";
        title.textContent = t.title || "新标签";
        title.title = t.url || "";
        const x = document.createElement("span");
        x.className = "x";
        x.textContent = "×";
        x.onclick = (e) => { e.stopPropagation(); closeTab(t.id); };
        el.appendChild(title); el.appendChild(x);
        el.onclick = () => activateTab(t.id);
        tabsEl.appendChild(el);
      }
      newtabBtn.disabled = tabs.length >= MAX_TABS;
      newtabBtn.title = tabs.length >= MAX_TABS ? "最多 5 个标签页" : "新建标签页";
    }

    function createTab(url, activate) {
      if (tabs.length >= MAX_TABS) return null;
      const id = ++tabSeq;
      const wv = document.createElement("webview");
      wv.setAttribute("allowpopups", "");
      wv.setAttribute("partition", "persist:moyu");
      wv.setAttribute("useragent", adaptiveOn ? MOBILE_UA : DESKTOP_UA);
      wv.setAttribute("preload", WV_PRELOAD);
      wv.setAttribute("src", url || DEFAULT_URL);
      wv.classList.add("off");
      viewEl.appendChild(wv);

      const tab = { id, webview: wv, title: "", url: url || DEFAULT_URL, uaStale: false, metrics: null,
                    zoom: USER_ZOOM, appliedZoom: USER_ZOOM };
      tabs.push(tab);

      wv.addEventListener("dom-ready", () => {
        // 每次导航后 zoom 会被重置，重新应用
        try { wv.setZoomFactor(tab.appliedZoom); } catch (e) {}
      });
      wv.addEventListener("did-navigate", (e) => {
        if (e.url && e.url !== "about:blank") {
          tab.url = e.url;
          if (tab.id === activeId) { urlInput.value = e.url; syncStar(); }
          pushHist(e.url, tab.title);
        }
      });
      wv.addEventListener("did-navigate-in-page", (e) => {
        if (e.url && e.url !== "about:blank") {
          tab.url = e.url;
          if (tab.id === activeId) { urlInput.value = e.url; syncStar(); }
          pushHist(e.url, tab.title);
        }
      });
      wv.addEventListener("page-title-updated", (e) => {
        tab.title = (e.title || "").slice(0, 18);
        updateHistTitle(tab.url, e.title);
        renderTabs();
      });
      wv.addEventListener("did-fail-load", (e) => {
        if (e.errorCode !== -3 && e.isMainFrame) { tab.title = "加载失败"; renderTabs(); }
      });
      wv.addEventListener("ipc-message", (e) => {
        if (e.channel === "moyu-scroll") {
          tab.metrics = e.args[0];
          if (tab.id === activeId) {
            renderHbar();
            if (fitWidth) fitTab(tab);
          }
        } else if (e.channel === "moyu-newtab") {
          openExternalTab(e.args[0]);
        } else if (e.channel === "moyu-zoom") {
          if (tab.id !== activeId) return;
          if (fitWidth) setFit(false);
          applyZoom(tab, tab.appliedZoom + (e.args[0] > 0 ? 0.1 : -0.1), true);
        } else if (e.channel === "moyu-dropfile") {
          openDocByPath(e.args[0]);
        }
      });

      if (activate !== false) activateTab(id);
      renderTabs();
      return tab;
    }

    function activateTab(id) {
      activeId = id;
      for (const t of tabs) {
        const on = t.id === id;
        t.webview.classList.toggle("off", !on);
        if (on) {
          urlInput.value = t.url || "";
          syncStar();
          if (t.uaStale) {
            t.uaStale = false;
            try { t.webview.setUserAgent(adaptiveOn ? MOBILE_UA : DESKTOP_UA); } catch (e) {}
            t.webview.reload();
          }
          setTimeout(() => { try { t.webview.focus(); } catch (e) {} }, 50);
        }
      }
      renderTabs();
      renderHbar();
      syncZoomUI();
      const cur = activeTab();
      if (cur) setTimeout(() => { if (fitWidth) fitTab(cur); }, 120);
    }

    function closeTab(id) {
      const i = tabs.findIndex((t) => t.id === id);
      if (i < 0) return;
      const [t] = tabs.splice(i, 1);
      try { t.webview.close(); } catch (e) {}
      t.webview.remove();
      if (tabs.length === 0) { createTab(DEFAULT_URL, true); return; }
      if (activeId === id) activateTab(tabs[Math.max(0, i - 1)].id);
      else { renderTabs(); renderHbar(); }
    }

    newtabBtn.onclick = () => createTab(DEFAULT_URL, true);

    /* ---------- 底部横向滚动条 ---------- */
    let dragging = false;

    function renderHbar() {
      const t = activeTab();
      const m = t && t.metrics;
      if (!m || m.maxX < 2) { hscroll.classList.remove("show"); return; }
      hscroll.classList.add("show");
      const trackW = hscroll.clientWidth;
      const thumbW = Math.max(24, Math.min(trackW, trackW * (m.vw / (m.vw + m.maxX))));
      const maxLeft = Math.max(0, trackW - thumbW);
      const ratio = m.maxX > 0 ? Math.min(1, m.x / m.maxX) : 0;
      hthumb.style.width = thumbW + "px";
      hthumb.style.left = Math.round(ratio * maxLeft) + "px";
    }

    function scrollToRatio(thumbLeft) {
      const t = activeTab();
      const m = t && t.metrics;
      if (!m) return;
      const trackW = hscroll.clientWidth;
      const thumbW = hthumb.offsetWidth;
      const maxLeft = Math.max(1, trackW - thumbW);
      const ratio = Math.min(1, Math.max(0, thumbLeft / maxLeft));
      try { t.webview.send("moyu-scroll-to", Math.round(ratio * m.maxX)); } catch (e) {}
      m.x = Math.round(ratio * m.maxX);
      renderHbar();
    }

    hthumb.addEventListener("pointerdown", (e) => {
      dragging = true;
      hthumb.setPointerCapture(e.pointerId);
      const startX = e.clientX;
      const startLeft = hthumb.offsetLeft;
      const move = (ev) => { if (dragging) scrollToRatio(startLeft + ev.clientX - startX); };
      const up = () => {
        dragging = false;
        hthumb.removeEventListener("pointermove", move);
        hthumb.removeEventListener("pointerup", up);
      };
      hthumb.addEventListener("pointermove", move);
      hthumb.addEventListener("pointerup", up);
      e.preventDefault();
    });

    hscroll.addEventListener("pointerdown", (e) => {
      if (e.target === hthumb) return;
      scrollToRatio(e.clientX - hthumb.offsetWidth / 2);
      e.preventDefault();
    });

    /* 窗口尺寸变化：先回到用户倍率，再按新宽度重新判断是否要缩 */
    let rzT = null;
    window.addEventListener("resize", () => {
      clearTimeout(rzT);
      rzT = setTimeout(() => {
        renderHbar();
        const t = activeTab();
        if (!t || !fitWidth) return;
        applyZoom(t, t.zoom, false);
        setTimeout(() => { const c = activeTab(); if (c) fitTab(c); }, 280);
      }, 180);
    });

    /* ---------- 导航 ---------- */
    function normalize(v) {
      v = String(v || "").trim();
      if (!v) return null;
      if (!/^https?:\/\//i.test(v)) {
        if (v.includes(".") && !v.includes(" ")) v = "https://" + v;
        else return null;
      }
      try { return new URL(v).href; } catch (e) { return null; }
    }
    function nav(v) {
      const t = activeTab();
      if (!t) return;
      const url = normalize(v);
      if (!url) return;
      try { t.webview.loadURL(url); } catch (e) { t.webview.setAttribute("src", url); }
    }
    document.getElementById("go").onclick = () => nav(urlInput.value);
    document.getElementById("ext").onclick = () => {
      const t = activeTab();
      if (t && t.url) window.moyu.openExternal(t.url);
    };
    urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") nav(urlInput.value); });
    document.getElementById("back").onclick = () => { const t = activeTab(); if (t) t.webview.goBack(); };
    document.getElementById("fwd").onclick = () => { const t = activeTab(); if (t) t.webview.goForward(); };
    document.getElementById("reload").onclick = () => { const t = activeTab(); if (t) t.webview.reload(); };

    /* ---------- 地址栏悬停 ---------- */
    let hideTimer = null;
    function showAddr() { clearTimeout(hideTimer); topwrap.classList.add("hover"); }
    function scheduleHide() {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => { if (!urlInput.matches(":focus")) topwrap.classList.remove("hover"); }, 2000);
    }
    topwrap.addEventListener("mouseenter", showAddr);
    topwrap.addEventListener("mouseleave", scheduleHide);
    urlInput.addEventListener("focus", showAddr);
    urlInput.addEventListener("blur", scheduleHide);

    /* ---------- 自适应 ---------- */
    function applyAdaptive(on, reload) {
      adaptiveOn = on;
      syncMenu();
      for (const t of tabs) {
        try { t.webview.setUserAgent(on ? MOBILE_UA : DESKTOP_UA); } catch (e) {}
        if (t.id === activeId) {
          if (reload && t.webview.getURL && t.webview.getURL() !== "about:blank") t.webview.reload();
          t.uaStale = false;
        } else {
          t.uaStale = true;
        }
      }
    }

    function toggleAdaptive() {
      const on = !adaptiveOn;
      applyAdaptive(on, true);
      window.moyu.setAdaptive(on);
    }
    function toggleTop() {
      topOn = !topOn;
      window.moyu.setTop(topOn);
      syncMenu();
    }

    /* ---------- 收藏夹 & 历史记录 ---------- */
    const FAV_KEY = "moyu-favs";
    const HIST_KEY = "moyu-history";
    function loadRecs(k) {
      try {
        const v = JSON.parse(localStorage.getItem(k));
        return Array.isArray(v) ? v.filter((x) => x && x.url) : [];
      } catch (e) { return []; }
    }
    const favs = loadRecs(FAV_KEY);
    const hist = loadRecs(HIST_KEY);
    const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return String(u || ""); } };
    const stripHash = (u) => String(u || "").split("#")[0];
    const fmtTime = (ts) => {
      const d = new Date(ts || Date.now()), n = new Date();
      const p2 = (x) => String(x).padStart(2, "0");
      if (d.toDateString() === n.toDateString()) return p2(d.getHours()) + ":" + p2(d.getMinutes());
      return (d.getMonth() + 1) + "/" + d.getDate();
    };

    function saveHist() {
      try { localStorage.setItem(HIST_KEY, JSON.stringify(hist)); } catch (e) {}
      if (histPanel.classList.contains("show")) renderHist();
    }
    function pushHist(url, title) {
      if (!/^https?:\/\//i.test(url || "") || url === DEFAULT_URL) return;
      const prev = hist[0];
      if (prev && stripHash(prev.url) === stripHash(url)) {
        if (title && prev.title !== title) { prev.title = title; saveHist(); }
        return;
      }
      hist.unshift({ url, title: title || hostOf(url), t: Date.now() });
      if (hist.length > 200) hist.length = 200;
      saveHist();
    }
    function updateHistTitle(url, title) {
      if (!url || !title) return;
      const rec = hist.find((h) => stripHash(h.url) === stripHash(url));
      if (!rec || rec.title === title) return;
      rec.title = title;
      saveHist();
    }

    function saveFavs() {
      try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch (e) {}
      syncStar();
      if (favPanel.classList.contains("show")) renderFavs();
    }
    function syncStar() {
      const t = activeTab();
      const on = !!(t && t.url && favs.some((f) => f.url === t.url));
      btnStar.classList.toggle("on", on);
      btnStar.title = on ? "取消收藏" : "收藏当前页";
    }

    function listItem(rec, withTime, onDel) {
      const el = document.createElement("div");
      el.className = "li";
      el.title = rec.url;
      const nm = document.createElement("div");
      nm.className = "nm";
      const t1 = document.createElement("div");
      t1.className = "t1";
      t1.textContent = rec.title || rec.url;
      const u = document.createElement("div");
      u.className = "u";
      u.textContent = hostOf(rec.url);
      nm.appendChild(t1); nm.appendChild(u);
      el.appendChild(nm);
      if (withTime) {
        const tm = document.createElement("div");
        tm.className = "tm";
        tm.textContent = fmtTime(rec.t);
        el.appendChild(tm);
      }
      const del = document.createElement("span");
      del.className = "del";
      del.textContent = "×";
      del.title = "删除这条";
      del.onclick = (e) => { e.stopPropagation(); onDel(); };
      el.appendChild(del);
      el.onclick = () => { openExternalTab(rec.url); closePanels(); };
      return el;
    }

    function renderFavs() {
      favList.innerHTML = "";
      document.getElementById("fav-count").textContent = favs.length ? favs.length + " 条" : "";
      if (!favs.length) { favList.innerHTML = '<div class="empty">还没有收藏 · 点顶栏 ☆ 收藏当前页</div>'; return; }
      favs.forEach((f, i) => favList.appendChild(listItem(f, false, () => { favs.splice(i, 1); saveFavs(); })));
    }
    function renderHist() {
      histList.innerHTML = "";
      if (!hist.length) { histList.innerHTML = '<div class="empty">还没有历史记录</div>'; return; }
      hist.slice(0, 80).forEach((h, i) => histList.appendChild(listItem(h, true, () => { hist.splice(i, 1); saveHist(); })));
    }
    document.getElementById("hist-clear").onclick = (e) => {
      e.stopPropagation();
      hist.length = 0;
      saveHist();
    };
    btnStar.onclick = () => {
      const t = activeTab();
      if (!t || !/^https?:\/\//i.test(t.url || "")) return;
      const i = favs.findIndex((f) => f.url === t.url);
      if (i >= 0) favs.splice(i, 1);
      else {
        favs.unshift({ url: t.url, title: t.title || hostOf(t.url), t: Date.now() });
        if (favs.length > 200) favs.length = 200;
      }
      saveFavs();
    };

    /* ---------- 文档阅读 ---------- */
    const readerEl = document.getElementById("reader");
    const rtitle = document.getElementById("rtitle");
    const rbody = document.getElementById("rbody");
    const rcontent = document.getElementById("rcontent");
    const dropzone = document.getElementById("dropzone");
    let curDocPath = "";
    let docFont = +(localStorage.getItem("moyu-doc-fs") || 15);

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function inlineMd(s) {
      return s
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>")
        .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2">$1</a>');
    }
    function md2html(src) {
      const lines = escapeHtml(String(src).replace(/\r\n?/g, "\n")).split("\n");
      const out = [];
      let list = null;
      const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
      for (const raw of lines) {
        const line = raw.trim();
        let m;
        if (!line) { closeList(); continue; }
        if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
          closeList();
          const n = Math.min(m[1].length, 4);
          out.push("<h" + n + ">" + inlineMd(m[2]) + "</h" + n + ">");
        } else if (/^(-{3,}|\*{3,})$/.test(line)) {
          closeList(); out.push("<hr>");
        } else if ((m = line.match(/^&gt;\s?(.*)$/))) {
          closeList(); out.push("<blockquote>" + inlineMd(m[1]) + "</blockquote>");
        } else if ((m = line.match(/^[-*]\s+(.*)$/))) {
          if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
          out.push("<li>" + inlineMd(m[1]) + "</li>");
        } else if ((m = line.match(/^\d+[.)]\s+(.*)$/))) {
          if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
          out.push("<li>" + inlineMd(m[1]) + "</li>");
        } else {
          closeList(); out.push("<p>" + inlineMd(line) + "</p>");
        }
      }
      closeList();
      return out.join("\n");
    }

    function fileUrl(p) {
      return "file:///" + encodeURI(String(p).replace(/\\/g, "/")).replace(/#/g, "%23");
    }

    /* ---------- 漫画 / 图片：单页翻页 ---------- */
    let comicFiles = [];
    let comicIdx = 0;
    let comicTitle = "";
    let comicW = +(localStorage.getItem("moyu-comic-w") || 100);   // 图片宽度 %

    function renderComicPage() {
      const f = comicFiles[comicIdx];
      if (!f) return;
      rtitle.textContent = comicTitle + "  " + (comicIdx + 1) + "/" + comicFiles.length;
      rcontent.innerHTML = '<img src="' + fileUrl(f) + '" alt="">';
      applyDocFont();
      rbody.scrollTop = 0;
      rbody.scrollLeft = 0;
      const nx = comicFiles[comicIdx + 1];       // 预载下一页，翻页不掉帧
      if (nx) { const im = new Image(); im.src = fileUrl(nx); }
    }
    function comicStep(d) {
      const n = comicIdx + d;
      if (n < 0 || n >= comicFiles.length) return;
      comicIdx = n;
      renderComicPage();
    }
    function showComic(title, files) {
      if (!files || !files.length) return;
      comicFiles = files.slice();
      comicIdx = 0;
      comicTitle = title || "";
      readerEl.classList.add("comic");
      rcontent.className = "inner comic";
      rcontent.style.fontSize = "";
      readerEl.classList.add("show");
      renderComicPage();
    }
    document.getElementById("rprev").onclick = () => comicStep(-1);
    document.getElementById("rnext").onclick = () => comicStep(1);
    /* 点左半屏上一页、右半屏下一页（漫画习惯） */
    rbody.addEventListener("click", (e) => {
      if (!readerEl.classList.contains("comic")) return;
      const r = rbody.getBoundingClientRect();
      comicStep(e.clientX - r.left < r.width / 2 ? -1 : 1);
    });

    function applyDocFont() {
      if (readerEl.classList.contains("comic")) {
        rcontent.style.setProperty("--cw", comicW + "%");
        localStorage.setItem("moyu-comic-w", String(comicW));
        return;
      }
      rcontent.style.fontSize = docFont + "px";
      localStorage.setItem("moyu-doc-fs", String(docFont));
    }
    function showReader(title, html, plain) {
      readerEl.classList.remove("comic");
      rcontent.className = "inner";
      rtitle.textContent = title || "";
      rcontent.innerHTML = html || "";
      rcontent.classList.toggle("plain", !!plain);
      applyDocFont();
      readerEl.classList.add("show");
      rbody.scrollTop = 0;
    }
    function closeReader() {
      readerEl.classList.remove("show", "comic");
      curDocPath = "";
      comicFiles = [];
      rcontent.innerHTML = "";
      rcontent.className = "inner";
    }
    document.getElementById("rclose").onclick = closeReader;
    document.getElementById("rfnt-m").onclick = () => {
      if (readerEl.classList.contains("comic")) { comicW = Math.max(50, comicW - 10); applyDocFont(); return; }
      docFont = Math.max(11, docFont - 1); applyDocFont();
    };
    document.getElementById("rfnt-p").onclick = () => {
      if (readerEl.classList.contains("comic")) { comicW = Math.min(200, comicW + 10); applyDocFont(); return; }
      docFont = Math.min(30, docFont + 1); applyDocFont();
    };
    document.getElementById("rexternal").onclick = () => {
      if (curDocPath) window.moyu.openExternal(fileUrl(curDocPath));
    };

    async function openDocByPath(p) {
      if (!p) return;
      curDocPath = p;
      const base = p.split(/[\\/]/).pop() || "";
      const ext = (base.includes(".") ? base.split(".").pop() : "").toLowerCase();
      if (ext === "pdf" || ext === "html" || ext === "htm") {
        // PDF / 网页文件交给 webview（内置 PDF 查看器）
        closeReader();
        openExternalTab(fileUrl(p));
        return;
      }
      const r = await window.moyu.readDoc(p);
      if (!r || !r.ok) {
        showReader(base || "文档",
          '<p style="color:var(--mid)">' + escapeHtml((r && r.err) || "读取失败") + "</p>", false);
        return;
      }
      if (r.ext === "comic") {
        showComic(r.name || base, r.files);
        return;
      }
      if (r.ext === "docx") {
        try {
          const bytes = Uint8Array.from(atob(r.b64), (c) => c.charCodeAt(0));
          const res = await window.mammoth.convertToHtml({ arrayBuffer: bytes.buffer });
          showReader(r.name, res.value || "<p>（空文档）</p>", false);
        } catch (e) {
          let msg = e.message || String(e);
          if (/Can't find end of central directory/.test(msg)) {
            msg = "不是有效的 docx 文件——可能是老版 .doc 改了后缀，或文件已损坏";
          } else if (/Corrupted zip/.test(msg)) {
            msg = "文件已损坏或不完整，重新下载/另存一份试试";
          }
          showReader(r.name, "<p>解析失败：" + escapeHtml(msg) + "</p>", false);
        }
        return;
      }
      if (r.ext === "md" || r.ext === "markdown") {
        showReader(r.name, md2html(r.text), false);
      } else {
        showReader(r.name, escapeHtml(r.text), true);
      }
    }
    async function pickAndOpenDoc() {
      closePanels();
      const p = await window.moyu.pickDoc();
      if (p) openDocByPath(p);
    }
    async function pickAndOpenFolder() {
      closePanels();
      const p = await window.moyu.pickFolder();
      if (p) openDocByPath(p);
    }

    /* 拖拽文件进窗口直接打开 */
    let dragCnt = 0;
    document.addEventListener("dragenter", (e) => { e.preventDefault(); dragCnt++; dropzone.classList.add("on"); });
    document.addEventListener("dragover", (e) => { e.preventDefault(); });
    document.addEventListener("dragleave", (e) => {
      e.preventDefault();
      dragCnt = Math.max(0, dragCnt - 1);
      if (!dragCnt) dropzone.classList.remove("on");
    });
    document.addEventListener("drop", (e) => {
      e.preventDefault();
      dragCnt = 0;
      dropzone.classList.remove("on");
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (!f) return;
      const p = window.moyu.pathForFile(f);
      if (p) openDocByPath(p);
    });

    /* ---------- 面板与按钮 ---------- */
    const PANELS = [linkPanel, alphaPanel, zoomPanel, morePanel, favPanel, histPanel];
    const barTriggers = { "fav-panel": document.getElementById("btn-fav"), "hist-panel": document.getElementById("btn-hist") };
    function syncBarTriggers() {
      for (const [pid, btn] of Object.entries(barTriggers)) {
        const p = document.getElementById(pid);
        if (btn && p) btn.classList.toggle("on", p.classList.contains("show"));
      }
    }
    function closePanels() {
      PANELS.forEach((x) => x.classList.remove("show"));
      syncBarTriggers();
    }
    /* 面板定位：贴在顶栏下方；高度按窗口剩余空间算，超出就自己滚 */
    function positionPanel(p) {
      const top = Math.round(topwrap.getBoundingClientRect().bottom + 4);
      p.style.top = top + "px";
      p.style.maxHeight = Math.max(64, window.innerHeight - top - 6) + "px";
      p.scrollTop = 0;
    }
    /* 窗口被拉小/拉大时，正开着的面板重新算高度 */
    window.addEventListener("resize", () => {
      PANELS.forEach((p) => { if (p.classList.contains("show")) positionPanel(p); });
    });
    function showPanel(p) { closePanels(); positionPanel(p); p.classList.add("show"); syncBarTriggers(); }
    function togglePanel(p) {
      const on = !p.classList.contains("show");
      closePanels();
      if (on) { positionPanel(p); p.classList.add("show"); syncBarTriggers(); }
    }
    function syncMenu() {
      const a = document.querySelector("#mi-adaptive .ck");
      const t = document.querySelector("#mi-top .ck");
      const h = document.querySelector("#mi-hover .ck");
      if (a) a.textContent = adaptiveOn ? "✓" : "";
      if (t) t.textContent = topOn ? "✓" : "";
      if (h) h.textContent = hoverOn ? "✓" : "";
    }
    document.getElementById("btn-more").onclick = (e) => {
      e.stopPropagation();
      syncMenu();
      togglePanel(morePanel);
    };
    /* 收藏夹 / 历史记录：顶栏常驻按钮，面板直接从按钮下方展开 */
    document.getElementById("btn-fav").onclick = (e) => {
      e.stopPropagation();
      if (favPanel.classList.contains("show")) { closePanels(); return; }
      renderFavs();
      showPanel(favPanel);
    };
    document.getElementById("btn-hist").onclick = (e) => {
      e.stopPropagation();
      if (histPanel.classList.contains("show")) { closePanels(); return; }
      renderHist();
      showPanel(histPanel);
    };
    document.getElementById("mi-doc").onclick = () => pickAndOpenDoc();
    document.getElementById("mi-docdir").onclick = () => pickAndOpenFolder();
    document.getElementById("opendoc").onclick = () => pickAndOpenDoc();
    document.getElementById("mi-zoom").onclick = () => { syncZoomUI(); showPanel(zoomPanel); };
    document.getElementById("mi-alpha").onclick = () => showPanel(alphaPanel);
    document.getElementById("mi-link").onclick = () => showPanel(linkPanel);
    document.getElementById("mi-adaptive").onclick = () => toggleAdaptive();
    document.getElementById("mi-top").onclick = () => toggleTop();
    document.getElementById("mi-hover").onclick = () => {
      hoverOn = !hoverOn;
      window.moyu.setHover(hoverOn);
      syncMenu();   // win:hover 会回推 prefs:changed，这里先手动刷一次
    };
    document.addEventListener("click", (e) => {
      if (PANELS.some((p) => p.contains(e.target))) return;
      closePanels();
    });
    /* 面板自带 × ，Esc 也能关 */
    PANELS.forEach((p) => {
      const x = p.querySelector(".close");
      if (x) x.onclick = (e) => { e.stopPropagation(); p.classList.remove("show"); };
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (readerEl.classList.contains("show")) { closeReader(); e.stopPropagation(); return; }
        if (PANELS.some((p) => p.classList.contains("show"))) { closePanels(); e.stopPropagation(); }
        return;
      }
      /* 漫画模式：←/PageUp 上一页，→/PageDown/空格 下一页 */
      if (!readerEl.classList.contains("show") || !readerEl.classList.contains("comic")) return;
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
        e.preventDefault(); comicStep(1);
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        e.preventDefault(); comicStep(-1);
      }
    }, true);

    /* 缩放面板 */
    function setFit(on) {
      fitWidth = !!on;
      localStorage.setItem("moyu-fit", fitWidth ? "1" : "0");
      fitBox.checked = fitWidth;
      const t = activeTab();
      if (t) {
        if (fitWidth) fitTab(t);
        else applyZoom(t, t.zoom, false);
      }
      syncZoomUI();
    }
    fitBox.onchange = () => setFit(fitBox.checked);
    zoomInput.addEventListener("input", () => {
      const t = activeTab();
      if (!t) return;
      if (fitWidth) setFit(false);
      applyZoom(t, +zoomInput.value / 100, true);
    });
    document.getElementById("copy").onclick = () => {
      const t = document.getElementById("bm");
      t.select(); document.execCommand("copy");
      document.getElementById("copy").textContent = "已复制";
      setTimeout(() => { document.getElementById("copy").textContent = "复制书签代码"; }, 1800);
    };
    alphaInput.addEventListener("input", () => {
      const v = +alphaInput.value;
      alphaVal.textContent = v + "%";
      window.moyu.setOpacity(v / 100);
    });

    /* ---------- 背景主题 ---------- */
    function applyTheme(t) {
      document.body.classList.toggle("t-gray", t === "gray");
      document.body.classList.toggle("t-light", t === "light");
      localStorage.setItem("moyu-theme", t);
      document.querySelectorAll(".bgbtn").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
    }
    document.querySelectorAll(".bgbtn").forEach((b) => {
      b.onclick = (e) => { e.stopPropagation(); applyTheme(b.dataset.t); };
    });
    applyTheme(localStorage.getItem("moyu-theme") || "dark");
    document.getElementById("btn-hide").onclick = () => window.moyu.hide();

    /* ---------- 外部推送 / 页内开新链接 ---------- */
    function openExternalTab(url) {
      if (!url) return;
      closeReader();   // 有新内容进来就退出阅读模式，别挡着
      if (tabs.length < MAX_TABS) createTab(url, true);
      else nav(url);   // 标签满了就在当前页打开
    }
    window.moyu.onOpen((url) => openExternalTab(url));
    window.moyu.onPrefs((p) => {
      if (typeof p.adaptive === "boolean" && p.adaptive !== adaptiveOn) applyAdaptive(p.adaptive, true);
      if (typeof p.top === "boolean") { topOn = p.top; syncMenu(); }
      if (typeof p.hoverHide === "boolean" && p.hoverHide !== hoverOn) { hoverOn = p.hoverHide; syncMenu(); }
      if (typeof p.opacity === "number") {
        alphaInput.value = Math.round(p.opacity * 100);
        alphaVal.textContent = Math.round(p.opacity * 100) + "%";
      }
    });

    (async () => {
      try {
        const p = await window.moyu.getPrefs();
        adaptiveOn = p.adaptive !== false;
        topOn = p.top !== false;
        hoverOn = !!p.hoverHide;
        syncMenu();
        if (typeof p.opacity === "number") {
          alphaInput.value = Math.round(p.opacity * 100);
          alphaVal.textContent = Math.round(p.opacity * 100) + "%";
        }
      } catch (e) {}
      syncZoomUI();
      createTab(DEFAULT_URL, true);
    })();
  </script>
</body>
</html>
